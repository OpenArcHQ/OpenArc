# Account access enabled. Exactly the 15 reviewed /v2/auth/* routes proxy to
# the verified TLS API upstream on the same path, with the query string passed
# through unchanged so the API's existing no-query validator rejects queries.
# Every other /v2/auth/ request is fail-closed with 404; there is no catch-all
# endpoint, no URL rewriting and no query normalization.

location = /v2/auth { return 404; }

location = /v2/auth/bootstrap {
  client_max_body_size 16k;
  client_body_buffer_size 16k;
  client_body_in_file_only off;
  include /etc/nginx/auth_proxy_params;
  proxy_pass https://${API_UPSTREAM_HOST}/v2/auth/bootstrap;
}


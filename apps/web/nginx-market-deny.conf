# Common marketplace fail-closed fallbacks.
#
# Always included by the API-enabled templates AFTER the enabled business
# includes (and also directly by the no-API template). Every family root and
# every unknown/lookalike subpath in the three marketplace families is denied
# locally with 404 so a malformed or disabled path can never be proxied and can
# never fall through to the SPA shell.
#
# These are prefix locations, NOT `^~`, so they never suppress the enabled
# anchored regex locations selected above them: nginx selects the longest
# matching prefix first, then a matching regex location still overrides a plain
# prefix. `^~` would disable that override and allow a crafted subpath to reach
# the deny instead of the exact enabled route.
#
# The marketplace-capability exact path and any suffix/lookalike are also
# denied here; the real capability route is declared earlier as an exact match
# and therefore wins for the single accepted path.

# Plain PREFIX locations (never `^~`) cover each family root, every unknown or
# malformed subpath AND bare suffix lookalikes such as `/v2/public/marketXYZ`
# or `/v2/public/marketplace-capabilitiesXYZ`, so a lookalike can never reach
# the SPA shell. The exact/anchored enabled locations declared earlier still
# win: an exact `=` match beats any prefix and a matching regex beats a plain
# prefix, so `/v2/public/market/listings`, the typed listing/provider reads and
# the exact marketplace-capabilities route stay reachable.
location /v2/public/market { return 404; }
location /v2/public/marketplace-capabilities { return 404; }

location /v2/provider { return 404; }

location /v2/moderator { return 404; }

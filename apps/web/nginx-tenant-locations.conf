# Protected organization reads enabled.
#
# Exactly the four reviewed GET routes proxy to the verified TLS API upstream
# on the original request path, preserving the query string unchanged. Every
# other /v1/operator/organizations request is fail-closed with 404, and the
# generic /v1/operator prefix is never proxied.
#
# Regex locations deliberately omit a URI part from proxy_pass so nginx
# preserves the original request URI (including query) exactly:
# https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass
#
# The complete regex strings are quoted so `{8}` and friends are regex
# quantifiers, not nginx configuration block delimiters.
#
# The canonical organization id is `openarc:org:<uuid>`; nginx normalizes the
# encoded `%3A` separators before location matching, so the pattern matches the
# literal canonical prefix followed by a canonical lowercase UUID.
#
# Body handling: `client_max_body_size 0` means UNLIMITED in nginx, so it is
# never used. A finite defensive limit is set, and any request that declares a
# Transfer-Encoding or a Content-Length other than absent/`0` is rejected in
# the rewrite phase before the body is read. Request buffering is off, so no
# body is spooled to disk, and the allowlisted headers never forward a body.

location = /v1/operator/organizations {
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  set $openarc_tenant_body_ok 1;
  if ($http_content_length != "") { set $openarc_tenant_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_tenant_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_tenant_body_ok 0; }
  if ($openarc_tenant_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/tenant_proxy_params;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location ~ "^/v1/operator/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  set $openarc_tenant_body_ok 1;
  if ($http_content_length != "") { set $openarc_tenant_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_tenant_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_tenant_body_ok 0; }
  if ($openarc_tenant_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/tenant_proxy_params;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location ~ "^/v1/operator/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/agents$" {
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  set $openarc_tenant_body_ok 1;
  if ($http_content_length != "") { set $openarc_tenant_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_tenant_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_tenant_body_ok 0; }
  if ($openarc_tenant_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/tenant_proxy_params;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location ~ "^/v1/operator/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/providers$" {
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  set $openarc_tenant_body_ok 1;
  if ($http_content_length != "") { set $openarc_tenant_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_tenant_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_tenant_body_ok 0; }
  if ($openarc_tenant_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/tenant_proxy_params;
  proxy_pass https://${API_UPSTREAM_HOST};
}

# Fail-closed: the bare operator family and every unknown subpath are denied.
location = /v1/operator { return 404; }
location /v1/operator/ { return 404; }

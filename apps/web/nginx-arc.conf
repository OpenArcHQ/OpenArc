server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log off;
  error_log /dev/null emerg;
  client_max_body_size 16k;

  root /usr/share/nginx/html;
  index index.html;

  proxy_ssl_name ${API_UPSTREAM_SNI};
  proxy_ssl_trusted_certificate ${API_TRUST_BUNDLE};

  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control "no-store" always;
  add_header Pragma "no-cache" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'none'" always;

  location = /healthz { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/healthz; }
  location = /readyz { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/readyz; }
  location = /metrics { return 404; }
  location = /v1/private/capabilities { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/v1/private/capabilities; }
  location = /v1/private/arc/account-snapshot {
    include /etc/nginx/proxy_params;
    proxy_set_header X-OpenArc-Proxy-Secret "${SOURCE_PROXY_SECRET}";
    proxy_set_header X-OpenArc-Proxy-Client-IP $http_x_real_ip;
    proxy_pass https://${API_UPSTREAM_HOST}/v1/private/arc/account-snapshot;
  }
  location = /v1/private/arc/transaction-evidence {
    include /etc/nginx/proxy_params;
    proxy_set_header X-OpenArc-Proxy-Secret "${SOURCE_PROXY_SECRET}";
    proxy_set_header X-OpenArc-Proxy-Client-IP $http_x_real_ip;
    proxy_pass https://${API_UPSTREAM_HOST}/v1/private/arc/transaction-evidence;
  }
  location = /v1/private/arc/agent-registry-evidence {
    include /etc/nginx/proxy_params;
    proxy_set_header X-OpenArc-Proxy-Secret "${SOURCE_PROXY_SECRET}";
    proxy_set_header X-OpenArc-Proxy-Client-IP $http_x_real_ip;
    proxy_pass https://${API_UPSTREAM_HOST}/v1/private/arc/agent-registry-evidence;
  }
  location = /v1/private/arc/job-evidence {
    include /etc/nginx/proxy_params;
    proxy_set_header X-OpenArc-Proxy-Secret "${SOURCE_PROXY_SECRET}";
    proxy_set_header X-OpenArc-Proxy-Client-IP $http_x_real_ip;
    proxy_pass https://${API_UPSTREAM_HOST}/v1/private/arc/job-evidence;
  }
  location = /v1/private/gateway/transfer-evidence {
    include /etc/nginx/proxy_params;
    proxy_set_header X-OpenArc-Proxy-Secret "${SOURCE_PROXY_SECRET}";
    proxy_set_header X-OpenArc-Proxy-Client-IP $http_x_real_ip;
    proxy_pass https://${API_UPSTREAM_HOST}/v1/private/gateway/transfer-evidence;
  }
  location = /v1/private/gateway/transfer {
    include /etc/nginx/proxy_params;
    proxy_set_header X-OpenArc-Proxy-Secret "${SOURCE_PROXY_SECRET}";
    proxy_set_header X-OpenArc-Proxy-Client-IP $http_x_real_ip;
    proxy_pass https://${API_UPSTREAM_HOST}/v1/private/gateway/transfer;
  }

  include /etc/nginx/conf.d/openarc-auth-locations.inc;

  location / { try_files $uri $uri/ /index.html; }
}

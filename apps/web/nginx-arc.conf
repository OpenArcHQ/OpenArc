server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log off;
  error_log /dev/null emerg;
  client_max_body_size 16k;

  root /usr/share/nginx/html;
  index index.html;

  proxy_ssl_name ${API_UPSTREAM_SNI};
  proxy_ssl_trusted_certificate ${API_TRUST_BUNDLE};

  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control "no-store" always;
  add_header Pragma "no-cache" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'none'" always;

  location = /healthz { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/healthz; }
  location = /readyz { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/readyz; }
  location = /metrics { return 404; }
  location = /v2/public/capabilities {
    if ($request_method != GET) { return 405; }
    if ($request_uri != "/v2/public/capabilities") { return 400; }
    if ($http_transfer_encoding != "") { return 400; }
    if ($http_content_length != "") { return 400; }
    if ($http_content_type != "") { return 400; }
    if ($http_cookie != "") { return 403; }
    if ($http_authorization != "") { return 403; }
    if ($http_x_openarc_csrf != "") { return 403; }
    if ($http_idempotency_key != "") { return 403; }
    if ($http_x_openarc_proxy_secret != "") { return 403; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_headers off;
    proxy_set_header Host ${API_UPSTREAM_HOST};
    proxy_set_header Origin $http_origin;
    proxy_set_header X-OpenArc-Client $http_x_openarc_client;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
    proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
    proxy_set_header Accept $http_accept;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-OpenArc-Proxy-Secret "";
    proxy_set_header X-OpenArc-Proxy-Client-IP "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_set_header Idempotency-Key "";
    proxy_set_header X-OpenArc-Csrf "";
    proxy_set_header Content-Type "";
    proxy_set_header Content-Length "";
    proxy_set_header Transfer-Encoding "";
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_pass https://${API_UPSTREAM_HOST}/v2/public/capabilities;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Vary;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_next_upstream off;
  }
  location = /v1/private/capabilities { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/v1/private/capabilities; }
  location = /v1/private/arc/account-snapshot {
    include /etc/nginx/proxy_params;
    proxy_set_header X-OpenArc-Proxy-Secret "${SOURCE_PROXY_SECRET}";
    proxy_set_header X-OpenArc-Proxy-Client-IP $http_x_real_ip;
    proxy_pass https://${API_UPSTREAM_HOST}/v1/private/arc/account-snapshot;
  }
  location = /v1/private/arc/transaction-evidence {
    include /etc/nginx/proxy_params;
    proxy_set_header X-OpenArc-Proxy-Secret "${SOURCE_PROXY_SECRET}";
    proxy_set_header X-OpenArc-Proxy-Client-IP $http_x_real_ip;
    proxy_pass https://${API_UPSTREAM_HOST}/v1/private/arc/transaction-evidence;
  }
  location = /v1/private/arc/agent-registry-evidence {
    include /etc/nginx/proxy_params;
    proxy_set_header X-OpenArc-Proxy-Secret "${SOURCE_PROXY_SECRET}";
    proxy_set_header X-OpenArc-Proxy-Client-IP $http_x_real_ip;
    proxy_pass https://${API_UPSTREAM_HOST}/v1/private/arc/agent-registry-evidence;
  }
  location = /v1/private/arc/job-evidence {
    include /etc/nginx/proxy_params;
    proxy_set_header X-OpenArc-Proxy-Secret "${SOURCE_PROXY_SECRET}";
    proxy_set_header X-OpenArc-Proxy-Client-IP $http_x_real_ip;
    proxy_pass https://${API_UPSTREAM_HOST}/v1/private/arc/job-evidence;
  }
  location = /v1/private/gateway/transfer-evidence {
    include /etc/nginx/proxy_params;
    proxy_set_header X-OpenArc-Proxy-Secret "${SOURCE_PROXY_SECRET}";
    proxy_set_header X-OpenArc-Proxy-Client-IP $http_x_real_ip;
    proxy_pass https://${API_UPSTREAM_HOST}/v1/private/gateway/transfer-evidence;
  }
  location = /v1/private/gateway/transfer {
    include /etc/nginx/proxy_params;
    proxy_set_header X-OpenArc-Proxy-Secret "${SOURCE_PROXY_SECRET}";
    proxy_set_header X-OpenArc-Proxy-Client-IP $http_x_real_ip;
    proxy_pass https://${API_UPSTREAM_HOST}/v1/private/gateway/transfer;
  }

  include /etc/nginx/conf.d/openarc-auth-locations.inc;
  include /etc/nginx/conf.d/openarc-tenant-locations.inc;
  include /etc/nginx/conf.d/openarc-machine-locations.inc;

  # Marketplace feature includes. Each is selected independently at image build
  # time; an omitted business family is copied as an empty runtime .inc so this
  # server template stays byte-identical across flag combinations. The exact
  # marketplace-capabilities GET is unconditional here regardless of the flags.
  include /etc/nginx/conf.d/openarc-market-capability-locations.inc;
  include /etc/nginx/conf.d/openarc-market-catalog-locations.inc;
  include /etc/nginx/conf.d/openarc-listing-management-locations.inc;
  include /etc/nginx/conf.d/openarc-market-moderation-locations.inc;

  # Common deny fallbacks for every disabled/malformed marketplace path. Must be
  # plain prefix locations so they never suppress the enabled anchored regexes
  # selected above (no `^~`).
  include /etc/nginx/conf.d/openarc-market-deny.inc;

  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;

  add_header Cache-Control "no-store" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; worker-src 'none'; media-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  # Plain (non-API) builds fail closed for the protected organization read
  # family: no SPA fallback and no proxy for /v1/operator/organizations.
  location = /v1/operator { return 404; }
  location /v1/operator/ { return 404; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

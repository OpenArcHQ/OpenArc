# Human machine-credential management disabled. No proxy and no upstream
# reference: the six credential path families are dedicated fail-closed 404s,
# and the machine-only /v1/agent and /v1/provider session surfaces stay denied.
# These are exact-prefix/regex denies only; they never add a broad operator
# proxy and never shadow the accepted tenant include (exact and regex locations
# win over a prefix, and no operand here is broad).

location /v1/agent/ { return 404; }
location /v1/provider/ { return 404; }
location ~ "^/v1/operator/organizations/openarc:org:[0-9a-f-]+/(?:agents|providers)/openarc:(?:agent|provider):[0-9a-f-]+/credentials$" { return 404; }
location ~ "^/v1/operator/organizations/openarc:org:[0-9a-f-]+/(?:agent|provider)-credentials/[0-9a-f-]+/revoke$" { return 404; }
location ~ "^/v1/operator/organizations/openarc:org:[0-9a-f-]+/(?:agent|provider)-credential-mutations/[0-9a-f-]+$" { return 404; }

# Provider listing management (VITE_LISTING_MANAGEMENT_ENABLED=true).
#
# Exactly the twelve frozen listing_management routes under
# /v2/provider/organizations/:organizationId:
#   GET  .../listings                                  (listing_roots, list query)
#   POST .../listings                                  (listing_create)
#   GET  .../listings/:listingId                       (listing_root)
#   GET  .../listings/:listingId/versions              (listing_versions, history query)
#   POST .../listings/:listingId/versions              (listing_version_create)
#   GET  .../listings/:listingId/versions/:version     (listing_version)
#   GET  .../listing-mutations/:mutationId             (listing_draft_mutation_status)
#   GET  .../listing-providers                         (listing_provider_options, picker query)
#   POST .../listings/:listingId/versions/:version/publish
#   POST .../listings/:listingId/versions/:version/pause
#   POST .../listings/:listingId/versions/:version/retire
#   GET  .../listing-lifecycle-mutations/:mutationId  (listing_lifecycle_mutation_status)
#
# Mixed GET/POST collections dispatch their write verb to an internal-only
# named location via `error_page 418` + bare `return 418` inside `if`; no
# proxying directive sits inside an `if`. Named locations are reachable only
# through that internal dispatch, never externally.
#
# `proxy_pass` in the regex and named locations carries NO URI part so nginx
# preserves the original encoded request target exactly for decode-once API
# validation. UUID regexes are quoted (`{8}` is a quantifier). Shared ids carry
# their canonical typed prefix after nginx's single decode: the organization is
# `openarc:org:UUID`, the listing `openarc:listing:UUID` (version nibble [1-8]);
# mutation ids stay a bare UUIDv4. A client sends the prefix percent-encoded
# (`openarc%3Aorg%3A...`); double-encoded input decodes to a literal `%3A`, does
# not match and falls to the deny include.
#
# Only the three list families accept a raw, unmodified query. All query-free
# routes reject a literal `?` in the ORIGINAL $request_uri (including a bare
# `?`) instead of comparing encoded $request_uri to decoded $uri (which would
# reject the valid `%3A` encoding). GET rejects Authorization, Proxy-Authorization
# and all write-authority headers (CSRF/idempotency) and any body; POST requires
# JSON + CSRF + idempotency, rejects Authorization/Proxy-Authorization, and is
# bounded to 16KiB. No disk request/response buffering.

location ~ "^/v2/provider/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/listings$" {
  error_page 418 = @openarc_market_provider_listing_create;
  if ($request_method = POST) { return 418; }
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 400; }
  if ($http_idempotency_key != "") { return 400; }
  set $openarc_market_body_ok 1;
  if ($http_content_length != "") { set $openarc_market_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_market_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_market_body_ok 0; }
  if ($openarc_market_body_ok = 0) { return 400; }
  client_max_body_size 16k;
  include /etc/nginx/tenant_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location @openarc_market_provider_listing_create {
  if ($request_method != POST) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($request_uri ~ "\?") { return 400; }
  if ($http_content_type !~ "^application/json(; *charset=utf-8)?$") { return 415; }
  if ($http_transfer_encoding != "") { return 400; }
  if ($http_x_openarc_csrf = "") { return 400; }
  if ($http_idempotency_key = "") { return 400; }
  client_max_body_size 16k;
  include /etc/nginx/tenant_write_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}


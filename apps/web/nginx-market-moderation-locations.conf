# Marketplace moderation (VITE_MARKET_MODERATION_ENABLED=true).
#
# Exactly the three frozen moderation routes under
# /v2/moderator/organizations/:organizationId:
#   GET  .../listings/:listingId/versions/:version            (moderation_version)
#   POST .../listings/:listingId/versions/:version/origin-review
#   GET  .../listing-lifecycle-mutations/:mutationId          (moderation_mutation_status)
#
# Moderation requires account access + the API boundary, NOT tenant reads or
# writes: it is a distinct browser audience. `proxy_pass` carries no URI part so
# the original encoded request target reaches the API for decode-once
# validation. UUID regexes are quoted. Shared ids carry their canonical typed
# prefix after nginx's single decode: organization `openarc:org:UUID`, listing
# `openarc:listing:UUID` (version nibble [1-8]); mutation ids pin a bare UUIDv4.
# A client sends the prefix percent-encoded (`openarc%3Aorg%3A...`); double
# encoding decodes to a literal `%3A`, does not match and is denied.
#
# GET is query-free: it rejects a literal `?` in the ORIGINAL $request_uri
# (including a bare `?`) rather than comparing encoded $request_uri to decoded
# $uri (which would reject the valid `%3A`). GET rejects Authorization,
# Proxy-Authorization and write-authority headers, and any body. POST requires
# JSON + CSRF + idempotency, rejects Authorization/Proxy-Authorization, is
# 16KiB-bounded, and has no disk buffering.

location ~ "^/v2/moderator/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/listings/openarc:listing:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/versions/[1-9][0-9]{0,8}$" {
  if ($request_method != GET) { return 405; }
  if ($request_uri ~ "\?") { return 400; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 400; }
  if ($http_idempotency_key != "") { return 400; }
  set $openarc_market_body_ok 1;
  if ($http_content_length != "") { set $openarc_market_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_market_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_market_body_ok 0; }
  if ($openarc_market_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/tenant_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location ~ "^/v2/moderator/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/listings/openarc:listing:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/versions/[1-9][0-9]{0,8}/origin-review$" {
  if ($request_method != POST) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($request_uri ~ "\?") { return 400; }
  if ($http_content_type !~ "^application/json(; *charset=utf-8)?$") { return 415; }
  if ($http_transfer_encoding != "") { return 400; }
  if ($http_x_openarc_csrf = "") { return 400; }
  if ($http_idempotency_key = "") { return 400; }
  client_max_body_size 16k;
  include /etc/nginx/tenant_write_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location ~ "^/v2/moderator/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/listing-lifecycle-mutations/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
  if ($request_method != GET) { return 405; }
  if ($request_uri ~ "\?") { return 400; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 400; }
  if ($http_idempotency_key != "") { return 400; }
  set $openarc_market_body_ok 1;
  if ($http_content_length != "") { set $openarc_market_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_market_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_market_body_ok 0; }
  if ($openarc_market_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/tenant_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

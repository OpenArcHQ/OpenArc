# Public marketplace catalog reads (VITE_MARKET_CATALOG_ENABLED=true).
#
# Exactly the three frozen public_catalog GET routes:
#   catalog_list     GET /v2/public/market/listings
#   catalog_detail   GET /v2/public/market/listings/:listingId
#   catalog_provider GET /v2/public/market/providers/:providerId
#
# Regex locations use `proxy_pass` WITHOUT a URI part so nginx preserves the
# original encoded request target (path incl. %-encoding and the raw query)
# exactly, letting the API perform decode-once validation. UUID regexes are
# quoted so `{8}` is a quantifier, not a config block delimiter. The shared
# listing/provider id grammar accepts version nibble [1-8]; a listing is NOT
# narrowed to the UUIDv4 used by its creation mutation.
#
# Only catalog_list forwards a raw query, unmodified, to the API. Query-free
# routes reject a literal `?` in the ORIGINAL $request_uri (including a bare
# `?`), not $args: comparing encoded $request_uri to decoded $uri would reject
# the valid `%3A` encoding of the canonical typed ids.
#
# Shared ids carry their canonical typed prefix (`openarc:org:`, `openarc:listing:`,
# `openarc:provider:`) followed by the version-nibble [1-8] UUID. Nginx matches
# regex locations against the DECODED URI, so a client sends the ids
# percent-encoded (`openarc%3Alisting%3A...`) and the literal prefix below
# matches after nginx's single decode. Double-encoded input decodes to a literal
# `%3A`, does not match, and falls to the deny include.
#
# Credentials (including Proxy-Authorization) and bodies are rejected locally
# BEFORE the credentialless transport strips/omits them. Content-Type is
# rejected on these body-free reads too. Wrong methods are 405; unknown paths
# fall to the common deny include. No broad forwarding exists here.

location = /v2/public/market/listings {
  if ($request_method != GET) { return 405; }
  if ($http_cookie != "") { return 403; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 403; }
  if ($http_idempotency_key != "") { return 403; }
  if ($http_x_openarc_proxy_secret != "") { return 403; }
  if ($http_x_openarc_proxy_client_ip != "") { return 403; }
  if ($http_x_real_ip != "") { return 403; }
  if ($http_content_type != "") { return 400; }
  set $openarc_market_body_ok 1;
  if ($http_content_length != "") { set $openarc_market_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_market_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_market_body_ok 0; }
  if ($openarc_market_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/market_public_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location ~ "^/v2/public/market/listings/openarc:listing:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
  if ($request_method != GET) { return 405; }
  if ($request_uri ~ "\?") { return 400; }
  if ($http_cookie != "") { return 403; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 403; }
  if ($http_idempotency_key != "") { return 403; }
  if ($http_x_openarc_proxy_secret != "") { return 403; }
  if ($http_x_openarc_proxy_client_ip != "") { return 403; }
  if ($http_x_real_ip != "") { return 403; }
  if ($http_content_type != "") { return 400; }
  set $openarc_market_body_ok 1;
  if ($http_content_length != "") { set $openarc_market_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_market_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_market_body_ok 0; }
  if ($openarc_market_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/market_public_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location ~ "^/v2/public/market/providers/openarc:provider:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
  if ($request_method != GET) { return 405; }
  if ($request_uri ~ "\?") { return 400; }
  if ($http_cookie != "") { return 403; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 403; }
  if ($http_idempotency_key != "") { return 403; }
  if ($http_x_openarc_proxy_secret != "") { return 403; }
  if ($http_x_openarc_proxy_client_ip != "") { return 403; }
  if ($http_x_real_ip != "") { return 403; }
  if ($http_content_type != "") { return 400; }
  set $openarc_market_body_ok 1;
  if ($http_content_length != "") { set $openarc_market_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_market_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_market_body_ok 0; }
  if ($openarc_market_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/market_public_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

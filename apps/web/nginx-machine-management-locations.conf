# Human machine-credential management enabled.
#
# EXACTLY six reviewed path families:
#   GET/POST  .../agents/:agentId/credentials
#   GET/POST  .../providers/:providerId/credentials
#   POST      .../agent-credentials/:credentialId/revoke
#   POST      .../provider-credentials/:credentialId/revoke
#   GET       .../agent-credential-mutations/:mutationId
#   GET       .../provider-credential-mutations/:mutationId
#
# This include does NOT proxy any generic /v1/operator prefix, any machine
# session exchange/self/revoke endpoint, or the bare profile collections. A
# machine session is a machine-only Bearer surface and never receives a browser
# proxy or CORS.
#
# Regex locations proxy with NO URI part so nginx preserves the original request
# URI (including its bounded list query) exactly. Identity UUIDs accept the
# shared [1-8] version nibble; NEW credential/mutation UUIDs pin version 4.
# Mixed GET/POST credential routes dispatch POST to an internal-only named
# location via `error_page ... = @name` with a bare `return 418` inside `if`;
# no proxying directive is placed inside `if`, and a named location is only
# reachable from within the server.

# --- Agent credential collection: GET list / POST issue ---------------------
location ~ "^/v1/operator/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/agents/openarc:agent:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/credentials$" {
  error_page 418 = @openarc_machine_agent_credentials;
  if ($request_method = POST) { return 418; }
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 400; }
  if ($http_idempotency_key != "") { return 400; }
  set $openarc_machine_body_ok 1;
  if ($http_content_length != "") { set $openarc_machine_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_machine_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_machine_body_ok 0; }
  if ($openarc_machine_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/tenant_proxy_params;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location @openarc_machine_agent_credentials {
  if ($request_method != POST) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($args != "") { return 400; }
  if ($http_content_type !~ "^application/json(; *charset=utf-8)?$") { return 415; }
  if ($http_transfer_encoding != "") { return 400; }
  if ($http_x_openarc_csrf = "") { return 400; }
  if ($http_idempotency_key = "") { return 400; }
  client_max_body_size 8k;
  include /etc/nginx/tenant_write_proxy_params;
  proxy_pass https://${API_UPSTREAM_HOST};
}


# Protected organization reads AND writes enabled.
#
# Exactly the four reviewed GET read families retain GET, and the six accepted
# business writes plus two status GETs are added. This file deliberately
# REPLACES nginx-tenant-locations.conf only when the write flag is true; when
# the flag is false the accepted read include stays byte-unchanged.
#
# Regex locations use `proxy_pass` WITHOUT a URI part so nginx preserves the
# original request URI (including its encoded path) exactly. UUID regexes are
# quoted so `{8}` is a quantifier, not a block delimiter. Identity UUIDs accept
# the shared `[1-8]` version nibble; logical mutation UUIDs pin version `4`.
#
# Mixed-method locations (the organization list and the shared agents/providers
# collections) route their write verb to an internal-only named location using
# a bare `return 418` inside `if`; no proxying directive is placed inside `if`,
# and the named locations cannot be reached externally (a named location is
# only reachable via `error_page`/`try_files` from within the server). All
# wrong verbs return 405, unknown subpaths/lookalikes return 404, and the
# generic /v1/operator prefix is never proxied.

location = /v1/operator/organizations {
  error_page 418 = @openarc_tenant_write_organizations;
  if ($request_method = POST) { return 418; }
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 400; }
  if ($http_idempotency_key != "") { return 400; }
  set $openarc_tenant_body_ok 1;
  if ($http_content_length != "") { set $openarc_tenant_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_tenant_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_tenant_body_ok 0; }
  if ($openarc_tenant_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/tenant_proxy_params;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location @openarc_tenant_write_organizations {
  if ($request_method != POST) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($args != "") { return 400; }
  if ($http_content_type !~ "^application/json(; *charset=utf-8)?$") { return 415; }
  if ($http_transfer_encoding != "") { return 400; }
  if ($http_x_openarc_csrf = "") { return 400; }
  if ($http_idempotency_key = "") { return 400; }
  client_max_body_size 8k;
  include /etc/nginx/tenant_write_proxy_params;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location ~ "^/v1/operator/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 400; }
  if ($http_idempotency_key != "") { return 400; }
  set $openarc_tenant_body_ok 1;
  if ($http_content_length != "") { set $openarc_tenant_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_tenant_body_ok 1; }

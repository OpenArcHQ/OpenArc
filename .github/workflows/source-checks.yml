name: Public source checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check public commit identities
        run: node scripts/check-public-history.mjs
      - name: Test public history safeguards
        run: node --test scripts/check-public-history.test.mjs
      - name: Verify source, units and development browser journeys
        run: docker build -f scripts/Dockerfile.node22-gate -t openarc-public-source-gate .
      - name: Run account and tenant deployment tests in the built gate image
        run: |
          docker run --rm openarc-public-source-gate \
            node --test scripts/account-deployment.test.mjs scripts/tenant-deployment.test.mjs scripts/tenant-ci-wiring.test.mjs
      - name: Run real PostgreSQL database tests
        run: |
          set -euo pipefail
          DB_CONTAINER="openarc-db-test-${{ github.run_id }}-${{ github.run_attempt }}"
          cleanup() {
            docker rm -f "$DB_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d \
            --name "$DB_CONTAINER" \
            --network none \
            --tmpfs /var/lib/postgresql/data \
            -e POSTGRES_DB=openarc_auth_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=openarc_disposable_test \
            postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$DB_CONTAINER" pg_isready -U postgres -d openarc_auth_test >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'PostgreSQL did not become ready in time.' >&2
            exit 1
          fi
          docker run --rm \
            --network "container:$DB_CONTAINER" \
            -e OPENARC_TEST_DATABASE_URL='postgres://postgres:openarc_disposable_test@127.0.0.1:5432/openarc_auth_test' \
            openarc-public-source-gate \
            sh -c 'pnpm --filter @openarc/db test:postgres && pnpm --filter @openarc/api test:postgres && pnpm e2e:accounts'
      - name: Record verification boundary
        run: |
          echo 'Source gate passed, including real PostgreSQL database, account deployment tests, tenant deployment guards and the mocked tenant browser wiring. This is not production-image or passkey tenant evidence, not a whole-port result, and not a production deployment or full historical release gate.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Mocked tenant browser journeys run inside the root e2e gate and are not repeated in this workflow. Private pre-publication RC objects are intentionally absent. See docs/public-source-publication.md.' >> "$GITHUB_STEP_SUMMARY"
